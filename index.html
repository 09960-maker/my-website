<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>งูนักวิทยาศาสตร์</title>
<style>
:root{--ink:#12263a;--paper:#f3f6f9;--teal:#1f9d8f;--amber:#f2a33a;--red:#d6455d;--card:#1c3650;--line:#2f4b66;--muted:#9fb3c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--ink);color:var(--paper);font-family:"Sarabun","Noto Sans Thai","Thonburi",system-ui,sans-serif;font-size:17px;line-height:1.45;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;min-height:100%;padding:10px 16px 16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);color:var(--ink);font-weight:700;padding:14px 20px;width:100%}
.ghost{background:transparent;border:1px solid #3d566d;padding:6px 12px}
.muted{color:var(--muted)}.small{font-size:.8rem;margin:6px 0 0;text-align:center}
.hud{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-size:.95rem}
.hud b{font-size:1.05rem}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;text-align:center;margin-bottom:8px}
.card small{color:#5b7186}.name{font-size:1.7rem;font-weight:700;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chip{background:var(--c);color:var(--ink);border-radius:10px;padding:1px 10px;font-weight:700;font-size:.95rem}
.stage{position:relative;margin:0 auto}
canvas{display:block;border-radius:14px;touch-action:none}
.ov{position:absolute;inset:0;background:rgba(18,38,58,.93);border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:14px;gap:8px;overflow:auto}
.ov h2{margin:0;font-size:1.5rem;line-height:1.2}.ov p{margin:0}
.toast{min-height:2.9em;font-size:.9rem;text-align:center;margin:6px 0 2px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:54px 54px;gap:6px;justify-content:center}
.pad button{background:var(--card);border:2px solid var(--line);font-size:1.5rem}
.pad button:active{background:var(--teal)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf span{position:absolute;top:-40px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
.card.mis{padding:8px 12px;font-weight:700;font-size:1rem}
.qm{position:fixed;inset:0;background:rgba(9,20,32,.94);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.qbox{width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 16px;text-align:center}
.qbox small{color:#5b7186}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{background:#1c3650;color:var(--paper);font-size:1.8rem;font-weight:700;padding:16px 4px;border:2px solid #2f4b66}
.choice.t{font-size:1.2rem}.choice:disabled{cursor:default}
.choice.right{background:var(--teal);border-color:var(--teal)}
.choice.wrong{background:var(--red);border-color:var(--red)}
#fb{margin-top:14px}#fr{font-weight:700;font-size:1.1rem}#ff{color:#5b7186;font-size:.95rem;margin:4px 0 12px}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span id="lives"></span><span>⭐ <b id="pts">0</b></span><span>ด่าน <b id="lvl">1</b></span><span>🎯 <b id="prog">0</b>/3</span>
    <button id="pause" class="ghost" aria-label="พักเกม">⏸</button><button id="snd" class="ghost" aria-label="เปิดหรือปิดเสียง">🔊</button>
  </div>
  <div class="card mis" id="mission"></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="ov" id="ov" hidden><h2 id="ovT"></h2><p id="ovP"></p><button class="primary" id="ovB"></button></div>
  </div>
  <div class="toast" id="toast">ชนขวดสารเคมี 🧪 เพื่อเปิดคำถาม ปัดนิ้วหรือกดลูกศรเพื่อบังคับงู</div>
  <div class="pad">
    <button id="u" style="grid-column:2;grid-row:1" aria-label="ขึ้น">▲</button>
    <button id="l" style="grid-column:1;grid-row:2" aria-label="ซ้าย">◀</button>
    <button id="d" style="grid-column:2;grid-row:2" aria-label="ลง">▼</button>
    <button id="r" style="grid-column:3;grid-row:2" aria-label="ขวา">▶</button>
  </div>
  <p class="small muted" id="off"></p>
  <p class="small muted" id="ios" hidden>iPhone: แตะปุ่มแชร์ แล้วเลือก "เพิ่มที่หน้าจอโฮม"</p>
  <p class="small"><button class="ghost" id="install" hidden>ติดตั้งแอปบนเครื่อง</button></p>
</div>

<div class="qm" id="qm" hidden><div class="qbox">
  <small id="qp"></small><div class="name" id="qn"></div>
  <div class="choices" id="ch"></div>
  <div id="fb" hidden><div id="fr"></div><div id="ff"></div><button class="primary" id="fnext">ไปต่อ</button></div>
</div></div>

<script>
/* ===== ข้อมูลคำถาม: นักเรียนเพิ่ม/แก้ไขได้ [ชื่อ, สัญลักษณ์, เลขอะตอม, ประเภท, ข้อเท็จจริง] ===== */
const EL=[
["ไฮโดรเจน","H",1,"อโลหะ","เป็นธาตุที่เบาที่สุดและมีมากที่สุดในเอกภพ"],
["ฮีเลียม","He",2,"แก๊สเฉื่อย","ใช้เติมลูกโป่งลอยฟ้า เพราะเบากว่าอากาศ"],
["ลิเทียม","Li",3,"โลหะ","ใช้ทำแบตเตอรี่โทรศัพท์และแล็ปท็อป"],
["คาร์บอน","C",6,"อโลหะ","เพชรและไส้ดินสอเป็นคาร์บอนเหมือนกัน"],
["ไนโตรเจน","N",7,"อโลหะ","เป็นแก๊สประมาณ 78% ของอากาศรอบตัวเรา"],
["ออกซิเจน","O",8,"อโลหะ","แก๊สที่เราใช้หายใจ และช่วยให้ไฟติด"],
["ฟลูออรีน","F",9,"อโลหะ","สารประกอบของมันอยู่ในยาสีฟันช่วยป้องกันฟันผุ"],
["นีออน","Ne",10,"แก๊สเฉื่อย","เรืองแสงสีส้มแดงในป้ายไฟนีออน"],
["โซเดียม","Na",11,"โลหะ","ทำปฏิกิริยารุนแรงกับน้ำ และเป็นส่วนหนึ่งของเกลือแกง"],
["แมกนีเซียม","Mg",12,"โลหะ","เผาแล้วให้แสงขาวจ้า ใช้ในพลุและไฟฉุกเฉิน"],
["อะลูมิเนียม","Al",13,"โลหะ","เบาและไม่เป็นสนิม ใช้ทำกระป๋องเครื่องดื่ม"],
["ซิลิคอน","Si",14,"กึ่งโลหะ","เป็นวัสดุหลักของชิปในคอมพิวเตอร์และมือถือ"],
["ฟอสฟอรัส","P",15,"อโลหะ","พบในหัวไม้ขีดไฟ และในกระดูกของเรา"],
["กำมะถัน","S",16,"อโลหะ","ธาตุสีเหลือง พบใกล้ภูเขาไฟและน้ำพุร้อน"],
["คลอรีน","Cl",17,"อโลหะ","ใช้ฆ่าเชื้อโรคในสระว่ายน้ำ"],
["แคลเซียม","Ca",20,"โลหะ","ช่วยให้กระดูกและฟันแข็งแรง"],
["เหล็ก","Fe",26,"โลหะ","อยู่ในเลือดของเรา และถูกแม่เหล็กดูดได้"],
["ทองแดง","Cu",29,"โลหะ","นำไฟฟ้าดี จึงใช้ทำสายไฟ"],
["เงิน","Ag",47,"โลหะ","นำไฟฟ้าและความร้อนได้ดีที่สุดในบรรดาโลหะ"],
["ทองคำ","Au",79,"โลหะ","ไม่หมองไม่เป็นสนิม จึงเงางามอยู่ได้นาน"],
["ปรอท","Hg",80,"โลหะ","โลหะชนิดเดียวที่เป็นของเหลวที่อุณหภูมิห้อง"],
["ตะกั่ว","Pb",82,"โลหะ","หนักและเป็นพิษ จึงเลิกใช้ในสีและน้ำมันเบนซิน"]
];
const TYPES=["โลหะ","กึ่งโลหะ","อโลหะ","แก๊สเฉื่อย"];
/* แต่ละด่านหมุนเวียนตามโหมดนี้ */
const MODES=[
{prompt:"สัญลักษณ์ของธาตุนี้คืออะไร",mission:"เก็บสัญลักษณ์ธาตุให้ถูกต้อง",q:e=>e[0],a:e=>e[1],opts:()=>EL.map(x=>x[1])},
{prompt:"เลขอะตอมของธาตุนี้คืออะไร",mission:"เก็บเลขอะตอมให้ถูกต้อง",q:e=>e[0]+" ("+e[1]+")",a:e=>e[2],opts:()=>EL.map(x=>x[2])},
{prompt:"ธาตุนี้จัดเป็นประเภทใด",mission:"แยกประเภทธาตุให้ถูกต้อง",q:e=>e[0],a:e=>e[3],opts:()=>TYPES}
];
const N=13,QPL=3;

const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let S={best:0,played:0,sound:true};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('lab3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lab3',JSON.stringify(S))}catch(e){}};

/* เสียง / สั่น / พลุ */
let ac;
function tone(f,d,t='sine',when=0,vol=.15){
  if(!S.sound)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+when;
    o.type=t;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d);}catch(e){}
}
const buzz=()=>{if(navigator.vibrate)navigator.vibrate(150)};
function confetti(){
  const b=document.createElement('div');b.className='conf';const em=['🎉','⭐','🧪','⚗️','✨'];
  for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=em[i%5];
    s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';s.style.fontSize=(16+Math.random()*16)+'px';b.appendChild(s);}
  document.body.appendChild(b);setTimeout(()=>b.remove(),3500);
}

/* สถานะเกม */
let snake,dir,pend,items=[],rocks=[],cur,pool=[],level,qIn,score,lives,streak,tm,running=false,ovCb;
const cv=$('cv'),ctx=cv.getContext('2d');let cell=20;

function resize(){
  const s=Math.max(240,Math.min(innerWidth-40,440,innerHeight-330));
  cell=Math.floor(s/N);const px=cell*N,d=devicePixelRatio||1;
  cv.width=px*d;cv.height=px*d;cv.style.width=cv.style.height=px+'px';
  ctx.setTransform(d,0,0,d,0,0);$('stage').style.width=px+'px';if(snake)draw();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function draw(){
  const px=cell*N;ctx.fillStyle='#0d1e2e';ctx.fillRect(0,0,px,px);
  ctx.fillStyle='#132b40';
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*cell,y*cell,cell,cell);
  ctx.fillStyle='#5b7186';rocks.forEach(r=>rr(r.x*cell+2,r.y*cell+2,cell-4,cell-4,5));
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.round(cell*.75)+'px sans-serif';
  items.forEach(it=>{
    const cx=it.x*cell+cell/2,cy=it.y*cell+cell/2;
    ctx.fillStyle='rgba(242,163,58,.28)';ctx.beginPath();ctx.arc(cx,cy,cell/2-1,0,7);ctx.fill();
    ctx.fillText('🧪',cx,cy+1);
  });
  snake.forEach((s,i)=>{ctx.fillStyle=i?'#1f9d8f':'#8ff0e2';rr(s.x*cell+1,s.y*cell+1,cell-2,cell-2,6)});
  const h=snake[0],cx=h.x*cell+cell/2,cy=h.y*cell+cell/2;
  ctx.fillStyle='#12263a';
  [-1,1].forEach(k=>{ctx.beginPath();ctx.arc(cx+dir.x*cell*.15-dir.y*k*cell*.2,cy+dir.y*cell*.15+dir.x*k*cell*.2,cell*.08+1,0,7);ctx.fill()});
}
function hud(){
  $('lives').textContent='❤️'.repeat(Math.max(lives,0));$('pts').textContent=score;
  $('lvl').textContent=level;$('prog').textContent=qIn;
  $('mission').textContent='🎯 '+MODES[(level-1)%3].mission+' • เหลืออีก '+(QPL-qIn)+' ชิ้น';
}

function resetSnake(){snake=[{x:5,y:6},{x:4,y:6},{x:3,y:6}];dir={x:1,y:0};pend=[]}
function genRocks(){
  rocks=[];const n=Math.min(2*(level-1),12);
  while(rocks.length<n){const c={x:rnd(N),y:rnd(N)};
    if(Math.abs(c.y-6)<=1&&c.x<=9)continue;
    if(rocks.some(r=>r.x===c.x&&r.y===c.y))continue;rocks.push(c);}
}
function spawn(n){
  const busy=new Set([...snake,...rocks,...items].map(c=>c.x+','+c.y)),h=snake[0],free=[];
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    const d=Math.min(Math.abs(x-h.x),N-Math.abs(x-h.x))+Math.min(Math.abs(y-h.y),N-Math.abs(y-h.y));
    if(!busy.has(x+','+y)&&d>=3)free.push({x,y});}
  items.push(...shuffle(free).slice(0,n));
}

/* ควบคุมเกม */
const spd=()=>Math.max(80,220-(level-1)*20);
function go(){clearInterval(tm);running=true;tm=setInterval(step,spd())}
function stop(){clearInterval(tm);running=false}
function ovShow(t,p,b,cb){stop();$('ovT').textContent=t;$('ovP').innerHTML=p;$('ovB').textContent=b;ovCb=cb;$('ov').hidden=false}
$('ovB').onclick=()=>{$('ov').hidden=true;if(ovCb)ovCb()};

function newGame(){score=0;lives=3;level=1;streak=0;pool=[];initLevel()}
function initLevel(){
  resetSnake();genRocks();qIn=0;items=[];spawn(QPL);hud();draw();
  const m=MODES[(level-1)%3];
  ovShow('ด่าน '+level,'ภารกิจ: '+m.mission+' '+QPL+' ชิ้น<br><small class="muted">ชนขวดสารเคมี 🧪 แล้วเกมจะหยุดเพื่อถามคำถาม แตะคำตอบที่ถูกได้เลย<br>ตอบผิดหรือชนก้อนหิน/ตัวเอง เสียหัวใจ 1 ดวง'+(level>1?'<br>ด่านนี้เร็วขึ้นและมีก้อนหินขวางทาง':'')+'</small>','เริ่มด่าน',go);
}
function step(){
  if(pend.length)dir=pend.shift();
  const h=snake[0],n={x:(h.x+dir.x+N)%N,y:(h.y+dir.y+N)%N};
  if(rocks.some(r=>r.x===n.x&&r.y===n.y)||snake.slice(0,-1).some(s=>s.x===n.x&&s.y===n.y))return crash();
  snake.unshift(n);
  const i=items.findIndex(t=>t.x===n.x&&t.y===n.y);
  if(i<0){snake.pop();draw();return}
  items.splice(i,1);draw();ask();
}

/* ชนขวดแล้วหยุดเกม ขึ้นคำถามพร้อมตัวเลือกให้แตะ */
function ask(){
  stop();
  if(!pool.length)pool=shuffle(EL.slice());
  const e=pool.pop(),m=MODES[(level-1)%3],ans=String(m.a(e));
  const wr=shuffle([...new Set(m.opts().map(String))].filter(x=>x!==ans)).slice(0,3);
  cur={e,ans};
  $('qp').textContent=m.prompt;$('qn').textContent=m.q(e);
  const ch=$('ch');ch.innerHTML='';
  shuffle([ans,...wr]).forEach(t=>{
    const b=document.createElement('button');
    b.className='choice'+(t.length>4?' t':'');b.textContent=t;b.dataset.v=t;
    b.onclick=()=>answer(b,t);ch.appendChild(b);
  });
  $('fb').hidden=true;$('qm').hidden=false;
}
function answer(b,pick){
  const ok=pick===cur.ans;
  [...$('ch').children].forEach(x=>{x.disabled=true;if(x.dataset.v===cur.ans)x.classList.add('right')});
  if(ok){
    streak++;qIn++;const gain=100+Math.min(streak-1,5)*20;score+=gain;
    tone(660,.12);tone(880,.18,'sine',.1);$('fr').textContent='✅ ถูกต้อง! +'+gain+' คะแนน';
  }else{
    streak=0;lives--;b.classList.add('wrong');snake.pop();spawn(1);
    tone(160,.3,'sawtooth');buzz();$('fr').textContent='❌ คำตอบที่ถูกคือ '+cur.ans;
  }
  $('ff').textContent='💡 '+cur.e[0]+': '+cur.e[4];
  $('fnext').textContent=lives<=0?'ดูผลคะแนน':(ok&&qIn>=QPL)?'ผ่านด่าน!':'ไปต่อ';
  hud();draw();$('fb').hidden=false;
}
$('fnext').onclick=()=>{
  $('qm').hidden=true;
  if(lives<=0)gameOver();else if(qIn>=QPL)levelClear();else{pend=[];go()}
};

function crash(){
  lives--;streak=0;tone(120,.4,'sawtooth');buzz();hud();
  if(lives<=0)return gameOver();
  const k=items.length;items=[];resetSnake();spawn(k);draw();
  ovShow('💥 ชนแล้ว!','เสียหัวใจ 1 ดวง งูกลับไปจุดเริ่มต้น','เล่นต่อ',go);
}
function levelClear(){
  score+=300;lives=Math.min(5,lives+1);hud();
  [523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',i*.12));
  ovShow('🎉 ผ่านด่าน '+level+'!','โบนัส +300 คะแนน และได้หัวใจเพิ่ม 1 ดวง','ด่านต่อไป',()=>{level++;initLevel()});
}
function gameOver(){
  const rec=score>S.best;if(rec)S.best=score;S.played++;save();
  const R=level>=6?['🏆','นักวิทยาศาสตร์ดีเด่น']:level>=4?['🥇','ผู้ช่วยนักวิจัย']:level>=2?['🥈','นักทดลองฝึกหัด']:['🥉','เด็กฝึกงานห้องแล็บ'];
  draw();
  ovShow(R[0]+' '+R[1],'ไปถึงด่าน '+level+'<br>คะแนน <b>'+score+'</b><br>'+(rec&&score>0?'🎉 สถิติใหม่!':'สถิติสูงสุด '+S.best+' คะแนน'),'เล่นใหม่',newGame);
  if(rec&&score>0)confetti();
}

/* การบังคับ: ปัดนิ้ว ปุ่มลูกศร คีย์บอร์ด */
function setDir(d){
  if(!running)return;
  const last=pend.length?pend[pend.length-1]:dir;
  if((d.x===-last.x&&d.y===-last.y)||(d.x===last.x&&d.y===last.y))return;
  if(pend.length<2)pend.push(d);
}
const DIRS={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
Object.keys(DIRS).forEach(k=>$(k).addEventListener('pointerdown',e=>{e.preventDefault();setDir(DIRS[k])}));
const KEYS={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
addEventListener('keydown',e=>{const k=KEYS[e.key];if(k){e.preventDefault();setDir(DIRS[k])}});
let t0;
cv.addEventListener('touchstart',e=>{t0={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(!t0)return;e.preventDefault();
  const dx=e.touches[0].clientX-t0.x,dy=e.touches[0].clientY-t0.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;
  setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.r:DIRS.l):(dy>0?DIRS.d:DIRS.u));
  t0={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:false});

function pause(){if(running)ovShow('⏸ พักเกม','','เล่นต่อ',go)}
$('pause').onclick=pause;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('snd').onclick=()=>{S.sound=!S.sound;save();$('snd').textContent=S.sound?'🔊':'🔇';tone(660,.1)};
$('snd').textContent=S.sound?'🔊':'🔇';
addEventListener('resize',resize);

/* เริ่มเกมทันทีเมื่อเปิดลิงก์ */
resetSnake();resize();newGame();

/* ===== PWA: ปุ่มติดตั้ง + คำแนะนำ iPhone + Service Worker ===== */
let deferred;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true};
addEventListener('appinstalled',()=>{$('install').hidden=true});
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)$('ios').hidden=false;
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js')
    .then(()=>navigator.serviceWorker.ready)
    .then(()=>{$('off').textContent='✓ พร้อมเล่นแบบออฟไลน์'})
    .catch(()=>{}));
}
</script>
